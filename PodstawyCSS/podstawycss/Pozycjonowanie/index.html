<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <title>Pozycjonowanie elementów na stronie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--  Marginesy  -->
      <!-- 
        USTALAMY WEDŁUG 🕰️ OD GÓRY
        margin - odstęp
        padding - wypełnienie 
        border - obramowanie

        box model
      -->

    <div id="kontener1">
        <h1>Przyjemne rzeczy schowane są za bólem</h1>
    </div>

    <!-- width + padding-left|right + border-left|right + margin-left|right -->

    <!-- Pozycjonowanie -->
    <!-- 
      static - statyczne (nieruchomy/domyślny)
      relative - względne (względem siebie coś przesuwamy, ale zajmuje miejsce w którym był)
      abosolute - bezwzględny/niezależny (nie bierze pod uwagi scrolla)
      fixed - ustalony

      top - od góry
      right - od prawej
      bottom - od dołu
      left - od lewej

    -->

    <div id="kontener3">
      <img src="../images/bagietson.png" alt="bagietson" width="225" height="225">
